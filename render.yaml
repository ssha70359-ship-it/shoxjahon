# Render.com uchun tayyor sozlama (Blueprint).
# Render -> New -> Blueprint -> repozitoriyani tanlang -> shu fayl o'qiladi.
#
# Bitta xizmat hammasini beradi:
#   https://<nom>.onrender.com/         -> Mini App
#   https://<nom>.onrender.com/admin/   -> Admin panel
#   https://<nom>.onrender.com/api/...  -> API, Telegram webhook
# Mini App manzili (WEBAPP_URL) va webhook avtomatik o'rnatiladi.
services:
  - type: web
    name: farhadskaya-bulochka
    runtime: node
    plan: free
    region: ohio # Neon bazasi ham us-east-2 (Ohio) da - tezroq

    # --include=dev: prisma va vite devDependencies'da (NODE_ENV=production bo'lsa ham o'rnatilsin)
    buildCommand: npm install --include=dev && npm run build:render
    startCommand: npm run server

    healthCheckPath: /api/health

    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production

      # Faqat Telegram imzosi bilan kirish (ommaviy serverda majburiy)
      - key: ALLOW_DEV_USER
        value: "false"

      # Quyidagilarni Render o'zi so'raydi - kompyuteringizdagi .env dan nusxa oling
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_IDS
        sync: false

      # Karta orqali to'lov (ixtiyoriy) - BotFather -> Payments. Bo'sh = faqat naqd
      - key: CLICK_PROVIDER_TOKEN
        sync: false
      - key: PAYME_PROVIDER_TOKEN
        sync: false
