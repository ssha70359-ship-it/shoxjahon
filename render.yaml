# Render.com uchun tayyor sozlama (Blueprint).
# Render -> New -> Blueprint -> repozitoriyani tanlang -> shu fayl o'qiladi.
services:
  - type: web
    name: bulochka-backend
    runtime: node
    plan: free
    region: ohio

    buildCommand: npm install && npm run build
    startCommand: npm run server

    healthCheckPath: /api/health

    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production

      # Faqat Telegram imzosi bilan kirish (ommaviy serverda majburiy)
      - key: ALLOW_DEV_USER
        value: "false"

      # Quyidagilarni Render panelida qo'lda to'ldirasiz
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_IDS
        sync: false

      # Karta orqali to'lov (ixtiyoriy) - BotFather -> Payments. Bo'sh = faqat naqd
      - key: CLICK_PROVIDER_TOKEN
        sync: false
      - key: PAYME_PROVIDER_TOKEN
        sync: false
