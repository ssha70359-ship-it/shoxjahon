# Bu fayl paket yig'ish uchun emas — faqat asboblar (ruff, pytest) sozlamasi.

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle xatolari
    "F",    # pyflakes (ishlatilmagan import, aniqlanmagan nom)
    "I",    # isort — import tartibi
    "UP",   # pyupgrade — eskirgan sintaksis
    "B",    # flake8-bugbear — tez-tez uchraydigan xatolar
    "ASYNC",# async/await bo'yicha xatolar
    "RUF",  # ruff'ning o'z qoidalari
]
ignore = [
    "B008",    # funksiya argumentida chaqiruv — aiogram/pydantic uslubida normal
    "RUF001",  # matnlarda kirill/lotin "o'xshash" belgilar — bizda ataylab
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# conftest.py da muhit o'zgaruvchilari import'lardan OLDIN o'rnatilishi shart
"tests/conftest.py" = ["E402"]
# testlarda xususiy (_ bilan boshlanadigan) maydonlarni tekshirish normal
"tests/*" = ["SLF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Loyiha ildizini sys.path ga qo'shamiz, shunda testlar `config`, `handlers`
# kabi modullarni import qila oladi.
#
# Busiz `python -m pytest` ishlaydi (u joriy papkani sys.path ga o'zi
# qo'shadi), lekin oddiy `pytest` buyrug'i ishlamaydi — CI aynan shunga
# yiqilgan edi. `pythonpath` ikkala usulni ham bir xil qiladi.
pythonpath = ["."]
# Barcha async testlar avtomatik ishga tushadi — har biriga dekorator shart emas
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
