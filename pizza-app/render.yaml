# Render Blueprint: New → Blueprint → Blueprint Path: pizza-app/render.yaml
# Bitta servis: API + bot (webhook) + Mini App.
services:
  - type: web
    name: olov-pizza
    runtime: node
    plan: free
    rootDir: pizza-app
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      # PUBLIC_URL shart emas — Render o'zi RENDER_EXTERNAL_URL beradi
      - key: DATABASE_URL
        value: file:./pizza.db
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: PAYMENT_PROVIDER_TOKEN
        sync: false
      - key: MINIAPP_SHORT_NAME
        sync: false
    # Bepul tarifda disk vaqtinchalik — baza har deploy'da tozalanadi.
    # Doimiy saqlash uchun (pullik tarif) quyidagini yoqing:
    # disk:
    #   name: pizza-data
    #   mountPath: /var/data
    #   sizeGB: 1
    # va DATABASE_URL ni o'zgartiring: file:/var/data/pizza.db
